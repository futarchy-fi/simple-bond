name: CI

on:
  push:
    branches: [main, "spec/**"]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Guardrail lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
      # Zero-dependency static guardrails (RC1 silent fallback, RC4 unguarded
      # writes, RC2 browser getLogs). Fails on any NEW violation over baseline.
      - name: Run guardrails
        run: node scripts/lint-guardrails.mjs

      # Fast fail-fast: parse the page's inline <script> (node --check). Catches
      # the load-time-SyntaxError class (e.g. a duplicate const that blanks the
      # dapp) in seconds, before the 10-min test/e2e jobs. Zero deps, no browser.
      - name: Frontend inline-script parse gate
        run: node scripts/check-inline-scripts.mjs

  test:
    name: Hardhat tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Compile contracts
        run: npx hardhat compile

      - name: Run tests
        run: npx hardhat test
        timeout-minutes: 10

  e2e:
    name: Playwright e2e (local + live)
    runs-on: ubuntu-latest
    needs: test
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-noble
      options: --user root
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install build tools (for native deps like better-sqlite3)
        run: apt-get update && apt-get install -y --no-install-recommends make g++ python3

      - name: Install dependencies
        run: npm ci

      - name: Compile contracts (needed for artifacts)
        run: npx hardhat compile

      - name: Spawn static server (background)
        run: |
          python3 -m http.server 8765 --directory frontend > /tmp/static-srv.log 2>&1 &
          for i in 1 2 3 4 5; do
            if curl -sf http://127.0.0.1:8765/ > /dev/null; then break; fi
            sleep 1
          done

      - name: Run Playwright (local project)
        run: npx playwright test --project local --reporter=list
        timeout-minutes: 10

      # Live-mainnet smoke that MUST pass — these only fail on a real
      # regression of a shipped fix (rate fabrication I1, slow/failed judge
      # resolution I3). Retry absorbs transient RPC flakiness; live-rate skips
      # (not fails) if the rate is transiently unavailable on every attempt.
      - name: Run Playwright (live-mainnet, hard-failing)
        run: npx playwright test --project live-mainnet --grep "judge resolution|live sUSDS rate" --reporter=list
        timeout-minutes: 6

      # Broader read-only live checks — informational; tolerate site flakiness.
      - name: Run Playwright (live-mainnet read-only, soft)
        run: npx playwright test --project live-mainnet --grep "A1|A2|A5|H1" --reporter=list
        timeout-minutes: 5
        continue-on-error: true

      - name: Upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
            screenshots/

  # Deploy gate: every address in the committed mainnet deployment record must
  # have bytecode on-chain and the judge/registry wiring must be live, BEFORE a
  # publish is trusted. Catches I7 (no-code address), I11/I12 (record drift).
  # Soft on PRs from forks (no RPC secret); required on main.
  verify-deployment:
    name: Verify mainnet deployment
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci
      - name: Compile contracts
        run: npx hardhat compile
      - name: Verify deployment against live chain
        env:
          ETH_RPC_URL: ${{ secrets.ETH_RPC_URL || 'https://ethereum-rpc.publicnode.com' }}
        run: npx hardhat run scripts/v6/verifyDeployment.js --network ethereum
        timeout-minutes: 5
