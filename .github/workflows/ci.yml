name: CI

on:
  push:
    branches: [main, "spec/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Hardhat tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Compile contracts
        run: npx hardhat compile

      - name: Run tests
        run: npx hardhat test
        timeout-minutes: 10

  e2e:
    name: Playwright e2e (local + live)
    runs-on: ubuntu-latest
    needs: test
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-noble
      options: --user root
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install build tools (for native deps like better-sqlite3)
        run: apt-get update && apt-get install -y --no-install-recommends make g++ python3

      - name: Install dependencies
        run: npm ci

      - name: Compile contracts (needed for artifacts)
        run: npx hardhat compile

      - name: Spawn static server (background)
        run: |
          python3 -m http.server 8765 --directory frontend > /tmp/static-srv.log 2>&1 &
          for i in 1 2 3 4 5; do
            if curl -sf http://127.0.0.1:8765/ > /dev/null; then break; fi
            sleep 1
          done

      - name: Run Playwright (local project)
        run: npx playwright test --project local --reporter=list
        timeout-minutes: 10

      - name: Run Playwright (live-mainnet read-only)
        run: npx playwright test --project live-mainnet --grep "A1|A2|A5|H1|judge resolution" --reporter=list
        timeout-minutes: 5
        continue-on-error: true

      - name: Upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
            screenshots/
