<!doctype html><html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Gelasio = metric-compatible Georgia (the app's heading face is "Georgia, serif"). -->
<link href="https://fonts.googleapis.com/css2?family=Gelasio:wght@600;700&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1200px; height:630px; }
  body {
    /* app tokens: --bg #fff, --text #111827, --accent #4f46e5, --muted #6b7280, --border #e5e7eb */
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Liberation Sans", sans-serif;
    background:#ffffff; color:#111827; padding:72px 80px; position:relative; overflow:hidden;
  }
  /* subtle indigo wash, echoing the app's accent — keeps it light, not flat */
  .wash { position:absolute; right:-140px; top:-160px; width:560px; height:560px;
          background: radial-gradient(circle, rgba(79,70,229,.10), transparent 64%); }
  .rule { position:absolute; left:0; top:0; width:100%; height:8px; background:#4f46e5; }
  .serif { font-family:"Gelasio", Georgia, "Liberation Serif", serif; }
  .brand { display:flex; align-items:center; gap:18px; }
  .mark { width:72px; height:72px; border-radius:17px; background:#4f46e5;
          display:flex; align-items:center; justify-content:center; }
  .wordmark { font-size:44px; font-weight:700; letter-spacing:-.5px; color:#111827; }
  .wordmark b { color:#4f46e5; font-weight:700; }
  h1 { font-size:80px; line-height:1.06; font-weight:700; letter-spacing:-1.5px;
       margin-top:84px; max-width:1010px; color:#111827; }
  h1 .ink { color:#4f46e5; }
  p.sub { font-size:32px; line-height:1.45; color:#4b5563; margin-top:28px; max-width:980px; }
  .foot { position:absolute; left:80px; bottom:62px; display:flex; align-items:center; gap:22px; }
  .pill { font-size:26px; font-weight:600; color:#ffffff; background:#4f46e5;
          padding:11px 22px; border-radius:999px; letter-spacing:-.2px; }
  .mech { font-size:25px; color:#6b7280; font-weight:500; }
</style></head>
<body>
  <div class="rule"></div>
  <div class="wash"></div>

  <div class="brand">
    <div class="mark">
      <svg viewBox="0 0 64 64" width="44" height="44"><path d="M18 33 l9.5 9.5 L46 22" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
    <div class="wordmark serif">Claim<b>Bond</b></div>
  </div>

  <h1 class="serif">Put money behind<br>your <span class="ink">claims</span>.</h1>
  <p class="sub">Post a claim with a bond. Anyone can challenge it. A judge rules who's right — winner takes the pot.</p>

  <div class="foot">
    <span class="pill">bond.futarchy.ai</span>
    <span class="mech">poster $X &nbsp;·&nbsp; challenger $Y &nbsp;→&nbsp; judge rules</span>
  </div>
</body></html>
