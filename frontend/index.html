  async function doOpenBond(bondId) {
    try {
      if (!signer) { await connectWallet(); if (!signer) return; }
      const tx = await bondWriteContract().openBond(bondId);
      await waitForTx(tx);
      log(`Bond #${bondId} re-opened.`);
      renderBondDetail(String(bondId));
    } catch (err) { alert(friendlyError(err)); log(`Open failed: ${friendlyError(err)}`, 'err'); }
  }
  async function doWithdrawBond(bondId) {
    try {
      if (!signer) { await connectWallet(); if (!signer) return; }
      if (!confirm('Withdraw the entire bond? This settles the bond permanently.')) return;
      const tx = await bondWriteContract().withdrawBond(bondId);
      await waitForTx(tx);
      log(`Bond #${bondId} withdrawn.`);
      renderBondDetail(String(bondId));
    } catch (err) { alert(friendlyError(err)); log(`Withdraw failed: ${friendlyError(err)}`, 'err'); }
  }
  async function doClaimTimeout(bondId, i) {
    try {
      if (!signer) { await connectWallet(); if (!signer) return; }
      const tx = await bondWriteContract().claimTimeout(bondId, i);
      await waitForTx(tx);
      log(`Timeout claimed for bond #${bondId}, challenge ${i}.`);
      renderBondDetail(String(bondId));
    } catch (err) { alert(friendlyError(err)); log(`Timeout failed: ${friendlyError(err)}`, 'err'); }
  }
  async function doDrainRefunds(bondId) {
    const msg = $('refundMsg');
    try {
      if (!signer) { await connectWallet(); if (!signer) return; }
      const n = parseInt($('refundCount').value || '10', 10);
      msg.innerHTML = `<div class="msg msg-info"><span class="spinner"></span>Draining up to ${n} refunds…</div>`;
      const tx = await bondWriteContract().claimRefunds(bondId, n);
      await waitForTx(tx);
      log(`Drained refunds for bond #${bondId} (max ${n}).`);
      msg.innerHTML = `<div class="msg msg-success">Refund batch processed.</div>`;
      setTimeout(() => renderBondDetail(String(bondId)), 600);
    } catch (err) {
      msg.innerHTML = `<div class="msg msg-error">${escapeHtml(friendlyError(err))}</div>`;
      log(`Refunds failed: ${friendlyError(err)}`, 'err');
    }
  }

  async function doRule(side, bondId, i, b) {
    try {
      if (!signer) { await connectWallet(); if (!signer) return; }
      const c = chain();
      const content = $(`rule-${i}`)?.value || '';
      const feeStr = $(`fee-${i}`)?.value || ethers.formatUnits(b.judgeFee, 18);
      let fee = ethers.parseUnits(feeStr, 18);
      if (fee > b.judgeFee) fee = b.judgeFee;
      const judge = manualJudgeContract(b.judge, true);
      const fn = side === 'poster' ? 'ruleForPoster' : 'ruleForChallenger';
      log(`${fn} on bond #${bondId} challenge ${i}…`);
      const tx = await judge[fn](c.bondContract, bondId, i, fee, content);
      await waitForTx(tx);
      log(`${fn} confirmed.`);
      renderBondDetail(String(bondId));
    } catch (err) { alert(friendlyError(err)); log(`Rule failed: ${friendlyError(err)}`, 'err'); }
  }
  async function doRejectChallenge(bondId, i, b) {
    try {
      if (!signer) { await connectWallet(); if (!signer) return; }
      const c = chain();
      const content = $(`reject-${i}`)?.value || $(`rule-${i}`)?.value || '';
      const judge = manualJudgeContract(b.judge, true);
      log(`rejectChallenge on bond #${bondId} challenge ${i}…`);
      const tx = await judge.rejectChallenge(c.bondContract, bondId, i, content);
      await waitForTx(tx);
      log(`Challenge rejected.`);
      renderBondDetail(String(bondId));
    } catch (err) { alert(friendlyError(err)); log(`Reject failed: ${friendlyError(err)}`, 'err'); }
  }
  async function doRejectBond(bondId, b) {
    try {
      if (!signer) { await connectWallet(); if (!signer) return; }
      const c = chain();
      const content = $('voidContent')?.value || '';
      if (!confirm('Void this bond entirely? The poster is refunded and all pending challenges become refundable.')) return;
      const judge = manualJudgeContract(b.judge, true);
      const tx = await judge.rejectBond(c.bondContract, bondId, content);
      await waitForTx(tx);
      log(`Bond #${bondId} voided by judge.`);
      renderBondDetail(String(bondId));
    } catch (err) { alert(friendlyError(err)); log(`Void failed: ${friendlyError(err)}`, 'err'); }
  }

  // ─── JUDGE PROFILE PAGE ────────────────────────────────────────────────
  async function renderJudgeProfile({ entryId, addr }) {
    const view = $('view');
    view.innerHTML = `<div class="loading"><span class="spinner"></span>Loading judge profile…</div>`;
    try {
      const c = chain();
      let entry;
      if (entryId != null && entryId !== '') {
        const reg = judgeRegRead();
        const [owner, judgeContract, contentHash, content] = await reg.getProfile(entryId);
        entry = { entryId, owner, judgeContract, contentHash, content };
      } else if (addr) {
        // Search entries for one matching this judge contract
        const reg = judgeRegRead();
        const count = Number(await reg.entryCount());
        let found = null;
        for (let i = count - 1; i >= 0; i--) {
          try {
            const [owner, judgeContract, contentHash, content] = await reg.getProfile(i);
            if (judgeContract.toLowerCase() === addr.toLowerCase()) {
              found = { entryId: i, owner, judgeContract, contentHash, content };
              break;
            }
          } catch (_) {}
        }
        if (!found) throw new Error(`No profile found for judge ${addr}.`);
        entry = found;
      } else {
        throw new Error('Missing entryId or addr in route.');
      }

      // Bonds judged by this address
      let bondsJudged = [];
      try {
        const bc = bondReadContract();
        const fromBlock = c?.deployBlock || 0;
        const logs = await withTimeout(bc.queryFilter(bc.filters.BondCreated(null, null, entry.judgeContract), fromBlock), 10000, []);
        bondsJudged = logs.map(l => ({ bondId: Number(l.args.bondId), claim: String(l.args.claimContent || '') }));
      } catch (_) {}

      view.innerHTML = `
        <div class="jp-header">
          <div>
            <div class="jp-title">Judge profile #${entry.entryId}</div>
            <div class="jp-subtitle">on ${escapeHtml(c?.name || '—')}</div>
          </div>
          <button class="secondary" onclick="history.back()">← Back</button>
        </div>
        <div class="card">
          <div class="grid-2">
            <div class="bond-field"><div class="label">Judge contract</div><div class="value">${addressLink(entry.judgeContract)}</div></div>
            <div class="bond-field"><div class="label">Profile owner</div><div class="value">${addressLink(entry.owner)}</div></div>
            <div class="bond-field"><div class="label">Content hash</div><div class="value mono" style="font-size:12px;">${entry.contentHash}</div></div>
          </div>
        </div>
        <div class="card">
          <h3>Judging statement</h3>
          <div class="jp-content">${escapeHtml(entry.content || '(no content)')}</div>
        </div>
        <div class="card">
          <h3>Bonds judged by this contract <span style="font-size:12px;font-weight:normal;color:var(--muted);">(${bondsJudged.length})</span></h3>
          ${bondsJudged.length === 0
            ? '<div class="hint">No bonds yet point to this judge contract.</div>'
            : bondsJudged.slice(0, 20).map(b => `<div class="bond-list-item" data-bondid="${b.bondId}">
                <div class="bli-head"><span class="bli-id">Bond #${b.bondId}</span></div>
                <div class="bli-claim">${escapeHtml(b.claim || '').slice(0, 200) || '<em>no preview</em>'}</div>
              </div>`).join('')}
          ${bondsJudged.length > 20 ? `<div class="hint">Showing 20 most recent of ${bondsJudged.length}.</div>` : ''}
        </div>
        <div class="card">
          <h3>Use this judge</h3>
          <p><a href="#create?judgeProfileId=${entry.entryId}">Create a new bond pinned to this profile (#${entry.entryId})</a></p>
        </div>`;
      view.querySelectorAll('.bond-list-item').forEach(item => {
        item.addEventListener('click', () => navigate('#view/' + item.dataset.bondid));
      });
    } catch (err) {
      view.innerHTML = `<div class="msg msg-error">${escapeHtml(friendlyError(err))}</div>
        <p style="margin-top:10px;"><a href="#judges">← Back to judges</a></p>`;
    }
  }

  // ─── Boot ──────────────────────────────────────────────────────────────
  function boot() {
    buildChainSelect();
    // Silent reconnect: if wallet exposes an already-permitted account, restore it.
    if (window.ethereum && window.ethereum.request) {
      window.ethereum.request({ method: 'eth_accounts' }).then(async (accs) => {
        if (accs && accs.length > 0) {
          try {
            provider = new ethers.BrowserProvider(window.ethereum);
            signer = await provider.getSigner();
            account = ethers.getAddress(accs[0]);
            $('walletAddr').textContent = short(account);
            $('walletInfo').classList.remove('hidden');
            $('connectBtn').classList.add('hidden');
            await refreshWalletChainId();
            attachWalletListeners();
            log(`Silent reconnect: ${account}`);
            render();
          } catch (_) {}
        }
      }).catch(() => {});
    }
    if (!location.hash) location.hash = '#browse';
    else render();
  }

  boot();
})();
</script>
</body>
</html>
