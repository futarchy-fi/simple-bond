  async function registerSimpleProfile(kind, content) {
    const msg = $(`${kind === 'poster' ? 'pp' : 'cp'}-msg`);
    const setMsg = (html) => { if (msg) msg.innerHTML = html; };
    try {
      const c = chain();
      const addr = kind === 'poster' ? c.posterProfileRegistry : c.challengerProfileRegistry;
      if (!addr) throw new Error(`Missing ${kind}ProfileRegistry address in runtime-config`);
      const abi = window.SIMPLE_BOND_V6_REGISTRY_ABI;
      const reg = writeContract(addr, abi);
      setMsg(`<div class="msg msg-info"><span class="spinner"></span>Submitting registerProfile(content) to ${escapeHtml(kind === 'poster' ? 'PosterProfileRegistry' : 'ChallengerProfileRegistry')}…</div>`);
      // Preflight via eth_call so any contract revert surfaces with its
      // reason string before MetaMask pops up.
      try { await reg.registerProfile.staticCall(content || ''); }
      catch (simErr) {
        const reason = simErr?.reason || simErr?.shortMessage || simErr?.message || String(simErr);
        throw new Error(`Pre-check failed: ${reason}`);
      }
      const tx = await reg.registerProfile(content || '');
      const r = await waitForTx(tx);
      const ev = r.logs.find(l => { try { return reg.interface.parseLog(l).name === 'ProfileRegistered'; } catch { return false; } });
      const entryId = ev ? reg.interface.parseLog(ev).args.entryId : '?';
      log(`Registered ${kind} profile entryId=${entryId}`, 'ok');
      const txLink = `<a href="${explorerTx(r.hash)}" target="_blank" rel="noopener">view tx</a>`;
      setMsg(`<div class="msg msg-success">Registered <strong>${escapeHtml(kind)}</strong> profile #${entryId}. ${txLink}</div>`);
    } catch (e) {
      if (!isUserRejection(e)) {
        log(friendlyError(e), 'err');
        setMsg(`<div class="msg msg-error">${escapeHtml(friendlyError(e))}</div>`);
      } else {
        setMsg('');
      }
    }
  }

  async function refreshOnboarding() {
    const titleEl = $('onboardTitle');
    const hintEl = $('onboardHint');
    const statusEl = $('onboardStatus');
    const addrRow = $('onboardAddress');
    const actions = $('onboardActions');
    if (!titleEl || !actions) return; // judges tab not active

    actions.innerHTML = '';
    addrRow.classList.add('hidden');
    addrRow.innerHTML = '';

    if (!signer) {
      titleEl.textContent = 'Set up your judge contract';
      hintEl.textContent = 'Connect a wallet to deploy your own judge contract, or paste the address of one you already control.';
      statusEl.textContent = '';
      const b = document.createElement('button');
      b.textContent = 'Connect wallet';
      b.addEventListener('click', () => connectWallet());
      actions.appendChild(b);
      return;
    }

    const myJudge = getMyJudgeContract();
    if (!myJudge) {
      titleEl.textContent = 'No judge contract yet';
      hintEl.textContent = '';
      statusEl.textContent = '';
      // Recovery path: if a previous deploy succeeded but activation failed
      // (two separate txs), the contract exists on-chain but this browser may
      // have lost the address. Let the user paste it back in to resume.
      const wrap = document.createElement('div');
      wrap.style.cssText = 'margin-top:10px;';
      wrap.innerHTML = `
        <details>
          <summary style="cursor:pointer;font-size:13px;color:var(--muted);">Already deployed a judge? Link it here</summary>
          <div class="row" style="gap:8px;margin-top:8px;align-items:center;">
            <input id="linkJudgeAddr" placeholder="0x… your ManualJudgeV6 address" style="flex:1;min-width:0;">
            <button id="linkJudgeBtn" class="secondary">Link</button>
          </div>
          <div id="linkJudgeMsg" class="hint" style="margin-top:6px;"></div>
        </details>`;
      actions.appendChild(wrap);
      $('linkJudgeBtn').addEventListener('click', async () => {
        const lm = $('linkJudgeMsg');
        const a = $('linkJudgeAddr').value.trim();
        if (!ethers.isAddress(a)) { lm.innerHTML = '<span class="msg-error">Not a valid address.</span>'; return; }
        try {
          const code = await readProvider().getCode(a);
          if (!code || code === '0x') { lm.innerHTML = `<span class="msg-error">No contract code at ${short(a)} on ${chain()?.name}.</span>`; return; }
          setMyJudgeContract(ethers.getAddress(a));
          refreshOnboarding();
        } catch (e) {
          lm.innerHTML = `<span class="msg-error">${escapeHtml(friendlyError(e))}</span>`;
        }
      });
      return;
    }

    titleEl.textContent = 'Your judge contract';
    hintEl.textContent = `You control this ManualJudgeV6 (deployed via this page).`;
    addrRow.innerHTML = `Judge contract: ${addressLink(myJudge)} <button class="ghost" id="copyJudgeBtn">Copy</button>`;
    addrRow.classList.remove('hidden');

    // Check active status of judge
    try {
      const judge = manualJudgeContract(myJudge, false);
      const [isActive, operator] = await Promise.all([
        judge.active().catch(() => null),
        judge.operator().catch(() => null),
      ]);
      if (isActive === false) {
        statusEl.textContent = 'Inactive — accept the operator role to activate.';
        const b = document.createElement('button');
        b.textContent = 'Activate judge (acceptOperatorRole)';
        b.addEventListener('click', () => acceptOperatorRole(myJudge));
        actions.appendChild(b);
      } else if (operator && operator.toLowerCase() !== account.toLowerCase()) {
        statusEl.textContent = `Active. Operator is ${short(operator)} (not your current wallet).`;
      } else {
        statusEl.textContent = 'Active. Register a profile below so posters can find you.';
      }
    } catch (err) {
      statusEl.textContent = `Could not read judge state: ${friendlyError(err)}`;
    }

    const b = document.createElement('button');
    b.className = 'secondary';
    b.textContent = 'Register profile for this judge';
    b.addEventListener('click', () => {
      $('jp-addr').value = myJudge;
      $('jp-content').focus();
      $('jp-content').scrollIntoView({ behavior: 'smooth', block: 'center' });
    });
    actions.appendChild(b);

    const forget = document.createElement('button');
    forget.className = 'ghost';
    forget.textContent = 'Forget this judge';
    forget.addEventListener('click', () => {
      if (confirm('Remove this judge from your local My-Judge cache? (The contract remains deployed.)')) {
        try { localStorage.removeItem(myJudgeKey()); } catch (_) {}
        refreshOnboarding();
      }
    });
    actions.appendChild(forget);

    setTimeout(() => {
      $('copyJudgeBtn')?.addEventListener('click', async () => {
        try { await navigator.clipboard.writeText(myJudge); log(`Copied ${myJudge}`); }
        catch (_) { prompt('Copy:', myJudge); }
      });
    });
  }

  async function deployFreshJudge() {
    const msg = $('judgeMsg');
    try {
      if (!signer) { await connectWallet(); if (!signer) return; }
      requireWalletOnActiveChain();
      if (!window.SIMPLE_BOND_V6_MANUAL_JUDGE_BYTECODE) throw new Error('Missing manualJudgeV6.bytecode.js');
      msg && (msg.innerHTML = `<div class="msg msg-info"><span class="spinner"></span>Deploying ManualJudgeV6 with you as proposed operator…</div>`);
      log(`Deploying ManualJudgeV6 (proposed operator: ${account})…`);
      const factory = new ethers.ContractFactory(
        ['constructor(address)'],
        window.SIMPLE_BOND_V6_MANUAL_JUDGE_BYTECODE,
        signer
      );
      // Preflight the deploy via estimateGas so a reverting constructor or a
      // bad bytecode surfaces with a reason BEFORE the wallet popup, instead
      // of a vague "Contract deployment: failed".
      try {
        const deployTx = await factory.getDeployTransaction(account);
        await readProvider().estimateGas({ from: account, data: deployTx.data });
      } catch (simErr) {
        const reason = simErr?.reason || simErr?.shortMessage || simErr?.message || String(simErr);
        throw new Error(`Pre-check failed: ${reason}`);
      }
      const judge = await factory.deploy(account);
      const deployTx = judge.deploymentTransaction();
      log(`Deploy tx sent: ${deployTx?.hash || '(hash pending)'} — waiting for confirmation…`);
      window.__txModal.pending('Deploying judge contract…', deployTx?.hash);
      await judge.waitForDeployment();
      const addr = await judge.getAddress();
      window.__txModal.confirmed('Judge contract deployed', deployTx?.hash);
      // Verify the contract code actually landed. MetaMask Smart Transactions
      // can report "done" while having dropped the tx — leaving no bytecode at
      // the predicted address. Don't advance the flow on a phantom deploy.
      const deployedCode = await readProvider().getCode(addr);
      if (!deployedCode || deployedCode === '0x') {
        throw new Error(`Deploy did not land — no contract code at ${addr}. If you use MetaMask Smart Transactions, turn it off (Settings → Transactions/Experimental → Smart Transactions) and retry.`);
      }
      // Persist the address NOW, before activation. The deploy and
      // acceptOperatorRole are two separate transactions; if activation
      // fails/stalls here we must not lose the deployed contract — otherwise
      // the page forgets it and offers to deploy a second one, orphaning the
      // first. With it saved, refreshOnboarding shows the "Activate judge"
      // button so the user can finish step 2 later.
      setMyJudgeContract(addr);
      log(`Deployed at ${addr}. Activating…`);
      msg && (msg.innerHTML = `<div class="msg msg-info"><span class="spinner"></span>Deployed at ${short(addr)}. Sending acceptOperatorRole…</div>`);
      const judgeC = manualJudgeContract(addr, true);
      const tx = await judgeC.acceptOperatorRole();
      const acceptReceipt = await waitForTx(tx);
      if (acceptReceipt && acceptReceipt.status === 0) {
        throw new Error(`acceptOperatorRole reverted (tx ${acceptReceipt.hash}). The judge contract is deployed at ${addr} but not yet activated — retry activation from "Your judge contract".`);
      }
      log(`Activated. You are operator of ${addr}.`);
      setMyJudgeContract(addr);
      $('jp-addr').value = addr;
      msg && (msg.innerHTML = `<div class="msg msg-success">Judge deployed and activated at ${addressLink(addr)}. Register a profile next.</div>`);
      refreshOnboarding();
    } catch (err) {
      log(`Deploy failed: ${friendlyError(err)}`, 'err');
      msg && (msg.innerHTML = `<div class="msg msg-error">${escapeHtml(friendlyError(err))}</div>`);
    }
  }

  async function acceptOperatorRole(judgeAddr) {
    const msg = $('judgeMsg');
    try {
      msg && (msg.innerHTML = `<div class="msg msg-info"><span class="spinner"></span>Sending acceptOperatorRole…</div>`);
      const j = manualJudgeContract(judgeAddr, true);
      const tx = await j.acceptOperatorRole();
      await waitForTx(tx);
      log(`Activated judge ${judgeAddr}`);
      msg && (msg.innerHTML = `<div class="msg msg-success">Judge activated.</div>`);
      refreshOnboarding();
    } catch (err) {
      log(`Activate failed: ${friendlyError(err)}`, 'err');
      msg && (msg.innerHTML = `<div class="msg msg-error">${escapeHtml(friendlyError(err))}</div>`);
    }
  }

  async function registerJudgeProfile() {
    // Inline status lives right under the Register button so the user sees
    // confirmation where they clicked. (The #judgeMsg slot up in the
    // onboarding card was too far away from the form to be useful.)
    const msg = $('jp-msg');
    try {
      if (!signer) { await connectWallet(); if (!signer) return; }
      const addr = $('jp-addr').value.trim();
      const content = $('jp-content').value;
      if (!addr) throw new Error('Judge contract address required.');
      if (!ethers.isAddress(addr)) throw new Error('Not a valid address.');
      if (/^0x0+$/i.test(addr)) throw new Error('Judge address cannot be the zero address.');
      // Confirm it's actually a deployed contract on the active chain. The
      // outer try/catch used to swallow this throw (defeating the check),
      // letting a Gnosis-only address or an EOA reach the wallet and bomb
      // there with a vague "couldn't be completed" message. If the RPC
      // itself errors we still proceed — that's the legitimate fallback
      // the original intent was reaching for.
      let codeProbeFailed = false;
      let code = '';
      try { code = await readProvider().getCode(addr); }
      catch (_) { codeProbeFailed = true; }
      if (!codeProbeFailed && (!code || code === '0x')) {
        throw new Error(`No contract code at ${addr} on ${chain()?.name || 'this chain'}. Did you mean to deploy a judge first, or paste an address from a different chain?`);
      }
      msg && (msg.innerHTML = `<div class="msg msg-info"><span class="spinner"></span>Registering profile…</div>`);
      const reg = judgeRegWrite();
      // Preflight via eth_call so any revert (e.g. "Zero judge") surfaces
      // BEFORE the MetaMask popup, with a clean reason string instead of
      // MetaMask Smart Transactions' generic "couldn't be completed".
      try { await reg.registerProfile.staticCall(ethers.getAddress(addr), content); }
      catch (simErr) {
        const reason = simErr?.reason || simErr?.shortMessage || simErr?.message || String(simErr);
        throw new Error(`Pre-check failed: ${reason}`);
      }
      const tx = await reg.registerProfile(ethers.getAddress(addr), content);
      const r = await waitForTx(tx);
      let entryId = null;
      const iface = new ethers.Interface(window.SIMPLE_BOND_V6_JUDGE_REGISTRY_ABI);
      for (const lg of r.logs) {
        try {
          const parsed = iface.parseLog({ topics: lg.topics, data: lg.data });
          if (parsed.name === 'ProfileRegistered') { entryId = Number(parsed.args.entryId); break; }
        } catch (_) {}
      }
      log(`Registered judge profile entryId=${entryId ?? '?'}. Save it — you'll use it as judgeProfileId when creating a bond.`);
      msg && (msg.innerHTML = `<div class="msg msg-success">Registered profile <strong>#${entryId ?? '?'}</strong>. <a href="#judge/${entryId ?? ''}">View profile</a> · <a href="#create">Create a bond pinning this profile</a></div>`);
      // optimistic refresh
      judgeState.entries = null;
      loadJudgeEntries();
    } catch (err) {
      log(`Register failed: ${friendlyError(err)}`, 'err');
      msg && (msg.innerHTML = `<div class="msg msg-error">${escapeHtml(friendlyError(err))}</div>`);
    }
  }

  async function loadJudgeEntries() {
    const c = chain();
    const listEl = $('judgesList');
    if (!c?.judgeProfileRegistry) {
      listEl.innerHTML = `<div class="empty-state">Judge registry not configured on ${escapeHtml(c?.name || 'this chain')}.</div>`;
      return;
    }
    listEl.innerHTML = `<div class="hint" style="padding:8px;"><span class="spinner"></span> Loading judge profiles…</div>`;
    // One automatic retry — public RPCs occasionally hand back a 5xx and the
    // FallbackProvider's per-call retry doesn't always cover read paths.
    // A Retry button is rendered on the final failure so the user isn't stuck
    // refreshing the whole page.
    let lastErr = null;
    for (let attempt = 0; attempt < 2; attempt++) {
      try {
        const reg = judgeRegRead();
        const count = Number(await reg.entryCount());
        if (count === 0) {
          listEl.innerHTML = `<div class="empty-state">No judge profiles registered yet on ${escapeHtml(c?.name || 'this chain')}.</div>`;
          return;
        }
        const start = Math.max(0, count - 50);
        const entries = [];
        for (let i = count - 1; i >= start; i--) {
          try {
            const [owner, judgeContract, contentHash, content] = await reg.getProfile(i);
            entries.push({ entryId: i, owner, judgeContract, contentHash, content });
            judgeProfileEntryCache[`${activeChainId}:${i}`] = { entryId: i, owner, judgeContract, contentHash, content };
          } catch (_) {}
        }
        judgeState.entries = entries;
        listEl.innerHTML = entries.map(e => judgeEntryHtml(e)).join('');
        return;
      } catch (err) {
        lastErr = err;
        if (attempt === 0) await new Promise(r => setTimeout(r, 800));
      }
    }
    listEl.innerHTML = `<div class="msg msg-error" style="display:flex;justify-content:space-between;align-items:center;gap:10px;">
        <span>Couldn't load profiles: ${escapeHtml(friendlyError(lastErr))}</span>
        <button id="judgesRetryBtn" class="secondary" style="padding:4px 10px;font-size:12px;">Retry</button>
      </div>`;
    const rb = $('judgesRetryBtn');
    if (rb) rb.addEventListener('click', () => loadJudgeEntries());
  }

  function judgeEntryHtml(e) {
    return `<div class="judge-item">
      <div class="ji-head">
        <span class="ji-id">Profile #${e.entryId}</span>
        <span style="font-size:12px;color:var(--muted);">judge ${addressLink(e.judgeContract)}</span>
        <span style="font-size:12px;color:var(--muted);">owner ${addressLink(e.owner)}</span>
      </div>
      <div class="ji-content">${escapeHtml(e.content || '(no content)')}</div>
      <div class="ji-actions">
        <a href="#judge/${e.entryId}">View profile</a>
        <a href="#create?judgeProfileId=${e.entryId}">Use this judge in a new bond</a>
      </div>
    </div>`;
  }

  // ─── CREATE WIZARD ─────────────────────────────────────────────────────
  // Draft persistence: every wizard input updates localStorage (debounced)
  // so an interrupted bond creation can be resumed later. Cleared once the
  // bond is successfully created or the user discards the draft. Scoped by
  // chain id since judgeProfileId / token are chain-specific.
  const DRAFT_KEY_PREFIX = 'simpleBond.draftCreateBond.v1.';
  let _draftRestored = false;
  let _draftSaveTimer = null;
  function draftKey() { return DRAFT_KEY_PREFIX + (activeChainId || 'unknown'); }
  function isDraftEmpty(s) {
    return !s.claim.trim()
      && s.bondAmount === '10'
      && s.challengeAmount === '3'
      && s.judgeFee === '0.5'
      && s.judgeProfileId === ''
      && Number(s.acceptanceDelay) === 7 * 86400
      && Number(s.rulingBuffer) === 7 * 86400
      && Number(s.maxChallenges) === 10;
  }
  function saveDraft() {
    try {
      if (isDraftEmpty(createState)) { localStorage.removeItem(draftKey()); return; }
      const data = {
        claim: createState.claim,
        bondAmount: createState.bondAmount,
        challengeAmount: createState.challengeAmount,
        judgeFee: createState.judgeFee,
        judgeProfileId: createState.judgeProfileId,
        acceptanceDelay: createState.acceptanceDelay,
        rulingBuffer: createState.rulingBuffer,
        maxChallenges: createState.maxChallenges,
        step: createState.step,
        savedAt: Date.now(),
      };
      localStorage.setItem(draftKey(), JSON.stringify(data));
    } catch (_) {}
  }
  function scheduleSaveDraft() {
    clearTimeout(_draftSaveTimer);
    _draftSaveTimer = setTimeout(saveDraft, 400);
  }
  function loadDraft() {
    try {
      const raw = localStorage.getItem(draftKey());
      return raw ? JSON.parse(raw) : null;
    } catch (_) { return null; }
  }
  function clearDraft() {
    try { localStorage.removeItem(draftKey()); } catch (_) {}
    _draftRestored = false;
  }
  function applyDraft(d) {
    if (!d || typeof d !== 'object') return false;
    if (typeof d.claim === 'string') createState.claim = d.claim;
    if (typeof d.bondAmount === 'string') createState.bondAmount = d.bondAmount;
    if (typeof d.challengeAmount === 'string') createState.challengeAmount = d.challengeAmount;
    if (typeof d.judgeFee === 'string') createState.judgeFee = d.judgeFee;
    if (typeof d.judgeProfileId === 'string') createState.judgeProfileId = d.judgeProfileId;
    if (typeof d.acceptanceDelay === 'number') createState.acceptanceDelay = d.acceptanceDelay;
    if (typeof d.rulingBuffer === 'number') createState.rulingBuffer = d.rulingBuffer;
    if (typeof d.maxChallenges === 'number') createState.maxChallenges = d.maxChallenges;
    if (typeof d.step === 'number') createState.step = Math.max(0, Math.min(4, d.step));
    return true;
  }

  // State persisted only while the create tab is visible.
  const createState = {
    step: 0,
    claim: '',
    bondAmount: '10',
    challengeAmount: '3',
    judgeFee: '0.5',
    judgeProfileId: '',
    judgeAddr: '',
    acceptanceDelay: 7 * 86400,
    rulingBuffer: 7 * 86400,
    maxChallenges: 10,
    token: '',  // override
    advancedOpen: false,
  };

  function resetCreateState() {
    const c = chain();
    createState.step = 0;
    createState.claim = '';
    createState.bondAmount = '10';
    createState.challengeAmount = '3';
    createState.judgeFee = '0.5';
    createState.judgeProfileId = '';
    createState.judgeAddr = '';
    createState.acceptanceDelay = 7 * 86400;
    createState.rulingBuffer = 7 * 86400;
    createState.maxChallenges = 10;
    createState.token = c?.approvedToken || '';
    createState.advancedOpen = false;
  }

  function renderCreate() {
    const c = chain();
    if (!createState.token) createState.token = c?.approvedToken || '';
    // Restore an in-progress draft if one exists and we haven't already
    // loaded it this session. createPrefill (deep-link judge id) wins over
    // the draft for the judge field.
    if (!_draftRestored) {
      const d = loadDraft();
      if (d && !isDraftEmpty(d)) {
        applyDraft(d);
        _draftRestored = true;
      }
    }
    if (createPrefill && createPrefill.judgeProfileId) {
      createState.judgeProfileId = createPrefill.judgeProfileId;
      createPrefill = {};
    }
    $('view').innerHTML = `
      <h2 style="margin-bottom:12px;">Create a bond on ${escapeHtml(c?.name || '—')}</h2>
      <div id="createWizard"></div>
      <div id="createMsg"></div>`;
    renderWizard();
  }

  function getStageIds() { return ['claim', 'stake', 'judge', 'timing', 'review']; }

  function isStageValid(i) {
    if (i === 0) return createState.claim.trim().length > 0;
    if (i === 1) {
      const b = parseFloat(createState.bondAmount);
      const cha = parseFloat(createState.challengeAmount);
      const fee = parseFloat(createState.judgeFee);
      return b > 0 && cha > 0 && fee >= 0 && fee <= cha;
    }
    if (i === 2) {
      return createState.judgeProfileId !== '' && Number(createState.judgeProfileId) >= 0;
    }
    if (i === 3) {
      return Number(createState.acceptanceDelay) >= 0 && Number(createState.rulingBuffer) >= 0 && Number(createState.maxChallenges) > 0;
    }
    return true;
  }

  function renderWizard() {
    const c = chain();
    const stages = getStageIds();
    const cur = createState.step;
    const stageEl = $('createWizard');
    const progress = ((cur + 1) / stages.length) * 100;
    const draftBanner = _draftRestored
      ? `<div id="draftBanner" style="background:var(--surface-2);border:1px solid var(--border);border-radius:6px;padding:8px 12px;margin-bottom:12px;font-size:13px;display:flex;justify-content:space-between;align-items:center;gap:10px;">
          <span>Resumed from your saved draft.</span>
          <button type="button" id="draftDiscard" class="secondary" style="padding:4px 10px;font-size:12px;">Discard draft</button>
        </div>`
      : '';
    stageEl.innerHTML = `
      <div class="wizard">
        ${draftBanner}
        <div class="wizard-top">
          <div class="wizard-step-count">Step ${cur + 1} of ${stages.length}</div>
          <div class="wizard-progress"><div class="wizard-progress-bar" style="width:${progress}%"></div></div>
        </div>
        <div class="wizard-stage" id="stageBody"></div>
        <div class="wizard-nav">
          <button class="secondary" id="wizPrev" ${cur === 0 ? 'style="visibility:hidden"' : ''}>← Back</button>
          <div class="nav-spacer"></div>
          ${cur < stages.length - 1
            ? `<button id="wizNext" ${isStageValid(cur) ? '' : 'disabled'}>Continue</button>`
            : `<button id="wizCreate">Create bond</button>`}
        </div>
        <div id="wizStepper"></div>
      </div>`;
    renderStage(cur);
    if (_draftRestored) {
      const db = $('draftDiscard');
      if (db) db.addEventListener('click', () => { clearDraft(); resetCreateState(); renderCreate(); });
    }
    $('wizPrev').addEventListener('click', () => { createState.step = Math.max(0, cur - 1); saveDraft(); renderWizard(); });
    if (cur < stages.length - 1) {
      $('wizNext').addEventListener('click', () => {
        if (!isStageValid(cur)) return;
        createState.step = cur + 1;
        saveDraft();
        renderWizard();
      });
    } else {
      $('wizCreate').addEventListener('click', () => submitCreate());
    }
  }

  function renderStage(i) {
    const body = $('stageBody');
    const c = chain();
    if (i === 0) {
      body.innerHTML = `
        <div class="wizard-stage-header">
          <span class="wizard-stage-num">1</span>
          <span class="wizard-stage-title">Claim</span>
        </div>
        <div class="wizard-stage-hint">What public claim are you willing to stake money on?</div>
        <div class="form-group">
          <label for="cb-claim">Claim content (text, URL, or IPFS URI)</label>
          <textarea id="cb-claim" rows="5" placeholder='e.g. "All statistical claims in my March 2026 blog post are accurate and properly sourced."'>${escapeHtml(createState.claim)}</textarea>
          <div class="hint">A good claim is specific, verifiable, and bounded in scope. The contract hashes this string into <code>claimHash</code> and emits the raw content in the BondCreated event.</div>
        </div>`;
      $('cb-claim').addEventListener('input', (e) => { createState.claim = e.target.value; updateNextBtn(); });
    } else if (i === 1) {
      body.innerHTML = `
        <div class="wizard-stage-header">
          <span class="wizard-stage-num">2</span>
          <span class="wizard-stage-title">Stake</span>
        </div>
        <div class="wizard-stage-hint">Amounts in <strong>USD</strong>. The contract locks the equivalent <code>sUSDS</code> (Sky's yield-bearing dollar) under the hood — your stake earns the Sky Savings Rate while the bond is open.</div>
        <div class="grid-3">
          <div class="form-group">
            <label for="cb-bond">Bond amount ($)</label>
            <input id="cb-bond" value="${escapeHtml(createState.bondAmount)}" inputmode="decimal">

          </div>
          <div class="form-group">
            <label for="cb-ch">Challenge amount ($)</label>
            <input id="cb-ch" value="${escapeHtml(createState.challengeAmount)}" inputmode="decimal">
            <div class="hint mono" id="cb-ch-conv" style="font-size:11px;margin-top:4px;">&nbsp;</div>
          </div>
          <div class="form-group">
            <label for="cb-fee">Judge fee max ($)</label>
            <input id="cb-fee" value="${escapeHtml(createState.judgeFee)}" inputmode="decimal">
            <div class="hint mono" id="cb-fee-conv" style="font-size:11px;margin-top:4px;">&nbsp;</div>
          </div>
        </div>
        <div id="beliefCardSlot"></div>
        <details style="margin-top:14px;background:var(--surface-2);border-radius:6px;padding:10px 14px;">
          <summary style="cursor:pointer;font-weight:600;">About sUSDS — why your stake earns yield</summary>
          <p class="hint" style="margin:8px 0;">sUSDS is the savings token of <strong>Sky</strong> (formerly Maker), one of the longest-running stablecoin issuers in crypto. Locking sUSDS in a bond doesn't pause the yield: your stake keeps earning the Sky Savings Rate the whole time the bond is open. When the bond settles you get back the same number of sUSDS, now worth more USD than when you locked it.</p>
          <ul style="font-size:13px;margin:8px 0 4px 18px;">
            <li><a href="https://docs.sky.money/sky-token-suite/sky-savings-rate" target="_blank" rel="noopener">How sUSDS / Sky Savings Rate works</a> (Sky docs)</li>
            <li><a href="https://sky.money" target="_blank" rel="noopener">sky.money</a> — current rate &amp; one-stop deposit/withdraw UI</li>
            <li><a href="https://defillama.com/protocol/sky" target="_blank" rel="noopener">DeFiLlama: Sky TVL &amp; history</a></li>
            <li><a href="https://makerdao.com/sky" target="_blank" rel="noopener">MakerDAO → Sky transition</a></li>
          </ul>
        </details>`;
      // Partial re-render of the belief-thresholds card only — re-rendering
      // the whole stage on every keystroke blew focus off the input the user
      // was typing into. The inputs themselves stay mounted; only the
      // computed display below them updates.
      const renderBelief = () => {
        const b = parseFloat(createState.bondAmount) || 0;
        const cha = parseFloat(createState.challengeAmount) || 0;
        const fee = parseFloat(createState.judgeFee) || 0;
        let html = '';
        if (b > 0 && cha > 0) {
          const net = b + cha - fee;
          if (net > 0) {
            const challPct = (cha * 100 / net).toFixed(1);
            const postPct = ((1 - b / net) * 100).toFixed(1);
            html = `<div class="belief-card">
              <h3>Implied belief thresholds</h3>

                  <div class="belief-value">&gt;${challPct}%</div>

                  <div class="belief-desc">chance they're wrong</div>
                </div>
              </div>
            </div>`;
          }
        }
        $('beliefCardSlot').innerHTML = html;
      };
      renderBelief();
      // Live USD → sUSDS preview. The rate read is async; we render once
      // the helper resolves and then refresh on every keystroke off the
      // cached rate.
      let stakeRate = { unavailable: true, decimals: 18 };
      const renderConv = () => {
        const fmt = (idVal, slotId) => {
          const n = parseFloat(idVal);

          if (!slot) return;

        };
        fmt(createState.bondAmount, 'cb-bond-conv');

      };
      (async () => {
        try {
          const c2 = chain();

      $('cb-bond').addEventListener('input', (e) => { createState.bondAmount = e.target.value; ev(); });
      $('cb-ch').addEventListener('input', (e) => { createState.challengeAmount = e.target.value; ev(); });
      $('cb-fee').addEventListener('input', (e) => { createState.judgeFee = e.target.value; ev(); });
    } else if (i === 2) {
      body.innerHTML = `

          <div class="row" style="margin-top:8px;gap:8px;">
            <button type="button" class="secondary" id="cb-use-default-judge">Use the default test judge</button>
            <a href="#judges" style="font-size:13px;align-self:center;">Browse all registered profiles</a>
          </div>
          <div class="hint" style="margin-top:6px;">The <strong>default test judge</strong> (profile id 0) is the SimpleBond-operated <code>ManualJudgeV6</code>. Fine for early v0.6 experiments — rulings are made by us. For production claims, pick a profile from a judge you trust.</div>
        </div>
        <div id="cb-judgeResolved" class="hint" style="margin-top:8px;"></div>`;
      $('cb-jpid').addEventListener('input', (e) => { createState.judgeProfileId = e.target.value; resolveJudgeFromProfile(); updateNextBtn(); });
      $('cb-use-default-judge').addEventListener('click', () => {
        createState.judgeProfileId = '0';
        $('cb-jpid').value = '0';
        resolveJudgeFromProfile();
        updateNextBtn();
      });
      resolveJudgeFromProfile();
    } else if (i === 3) {
      const presetsHtml = (current, presets, kind) => presets.map(p =>
        `<button type="button" class="preset ${current === p.sec ? 'active' : ''}" data-${kind}="${p.sec}">${p.label}</button>`
      ).join('');
      const acceptPresets = [
        { label: '1h', sec: 3600 },
        { label: '1d', sec: 86400 },
        { label: '7d', sec: 7 * 86400 },
        { label: '30d', sec: 30 * 86400 },
      ];
      const rulingPresets = [
        { label: '1h', sec: 3600 },
        { label: '1d', sec: 86400 },
        { label: '7d', sec: 7 * 86400 },
        { label: '30d', sec: 30 * 86400 },
      ];
      body.innerHTML = `
        <div class="wizard-stage-header">
          <span class="wizard-stage-num">4</span>
          <span class="wizard-stage-title">Timing</span>
        </div>
        <div class="wizard-stage-hint">Per-challenge windows. Acceptance delay is poster's concession window; ruling buffer is the judge's window after that.</div>
        <div class="form-group">
          <label>Acceptance delay</label>
          <div class="preset-row" id="acceptPresets">${presetsHtml(createState.acceptanceDelay, acceptPresets, 'sec')}</div>
          <input id="cb-ad" type="number" min="0" value="${createState.acceptanceDelay}" placeholder="seconds">
        </div>
        <div class="form-group">
          <label>Ruling buffer</label>
          <div class="preset-row" id="rulingPresets">${presetsHtml(createState.rulingBuffer, rulingPresets, 'sec')}</div>
          <input id="cb-rb" type="number" min="0" value="${createState.rulingBuffer}" placeholder="seconds">
        </div>
        <div class="form-group">
          <label for="cb-max">${chain() && chain().bondVersion === 7 ? 'Max challenges pending at once' : 'Max challenges (total ever filed)'}</label>
          <input id="cb-max" type="number" min="1" value="${createState.maxChallenges}">
        </div>`;
      // Update preset highlights in place rather than re-rendering the whole
      // stage on every keystroke (which would blow focus off the input).
      const refreshPresetActive = (containerId, current) => {
        document.querySelectorAll(`#${containerId} .preset`).forEach(b => {
          if (Number(b.dataset.sec) === current) b.classList.add('active');
          else b.classList.remove('active');

      $('cb-ad').addEventListener('input', (e) => {

      $('cb-rb').addEventListener('input', (e) => {

      });
      $('cb-max').addEventListener('input', (e) => { createState.maxChallenges = Number(e.target.value || 0); updateNextBtn(); });
      document.querySelectorAll('#acceptPresets .preset').forEach(b => b.addEventListener('click', () => {
        createState.acceptanceDelay = Number(b.dataset.sec); renderStage(3); updateNextBtn();
      }));
      document.querySelectorAll('#rulingPresets .preset').forEach(b => b.addEventListener('click', () => {
        createState.rulingBuffer = Number(b.dataset.sec); renderStage(3); updateNextBtn();
      }));
    } else if (i === 4) {
      const c = chain();
      body.innerHTML = `
        <div class="wizard-stage-header">
          <span class="wizard-stage-num">5</span>
          <span class="wizard-stage-title">Review</span>
        </div>
        <div class="wizard-stage-hint">Confirm and create. You'll be asked to sign one approval (if needed) and the createBond tx.</div>
        <div class="summary-card">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">

            </div>

              <div class="summary-value">$${escapeHtml(createState.bondAmount)} / $${escapeHtml(createState.challengeAmount)} / $${escapeHtml(createState.judgeFee)} <span class="hint" style="font-size:11px;">(locked as sUSDS)</span></div>
            </div>
            <div class="summary-item">
              <div class="summary-label">Judge profile</div>
              <div class="summary-value">#${escapeHtml(String(createState.judgeProfileId))} ${createState.judgeAddr ? `→ ${addressLink(createState.judgeAddr)}` : ''}</div>
            </div>
            <div class="summary-item">
              <div class="summary-label">Acceptance delay</div>
              <div class="summary-value">${fmtSeconds(createState.acceptanceDelay)}</div>
            </div>
            <div class="summary-item">
              <div class="summary-label">Ruling buffer</div>
              <div class="summary-value">${fmtSeconds(createState.rulingBuffer)}</div>
            </div>
            <div class="summary-item">
              <div class="summary-label">Max challenges</div>
              <div class="summary-value">${createState.maxChallenges}</div>
            </div>
          </div>
          <div class="advanced-panel${createState.advancedOpen ? '' : ' hidden'}">
            <div class="form-group">
              <label for="cb-token">Token override (advanced)</label>
              <input id="cb-token" value="${escapeHtml(createState.token)}" placeholder="${escapeHtml(c?.approvedToken || '')}">
              <div class="hint">Defaults to <span class="mono">${escapeHtml(c?.approvedToken || '—')}</span> (chain's approved sUSDS).</div>
            </div>
            <div class="form-group">
              <label for="cb-claim2">Claim content</label>
              <textarea id="cb-claim2" rows="3">${escapeHtml(createState.claim)}</textarea>
              <div class="hint">You can paste an <span class="mono">ipfs://…</span> or <span class="mono">https://…</span> URI here for large claims.</div>

      if (createState.advancedOpen) {
        $('cb-token').addEventListener('input', (e) => { createState.token = e.target.value; });
        $('cb-claim2').addEventListener('input', (e) => { createState.claim = e.target.value; });
